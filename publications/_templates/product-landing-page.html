-->

<html lang="en">
<head>

  <link rel="canonical" href="https://www.ironveilpress.quest/publications/[product-slug]/">
  <meta property="og:type" content="book">

  <meta property="og:url" content="https://www.ironveilpress.quest/publications/[product-slug]/">

  <script type="application/ld+json">

  </script>
</head>
<body>
  <header><a href="/">Iron Veil Press</a></header>

      <img src="/[image-path]" width="[width]" height="[height]" alt="[Descriptive image alt text]">
